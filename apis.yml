name: Roby
description: >-
  Roby (Imageous, Inc.) is a Seattle-based building-management software company
  whose HVAC automation product connects room and space calendars with a
  building's BMS (building management system) to automatically switch HVAC to an
  unoccupied/energy-saving mode when spaces are not in use, delivering measured
  energy savings and extended equipment lifetime for K-12, higher-education, and
  office facilities without added staff effort. Roby is deployed through building
  system integrators (ATS, Climatec, Syserco, ABM Systems, Oprizon, NSF-E) and
  also offers Receptionist and Helpdesk workplace applications. The product uses
  Auth0-managed authentication with token-based, SSL-only API access, but does
  not currently publish a public developer API, OpenAPI specification, SDKs, or
  developer portal. Surfaced as a Techstars portfolio company and added to the
  API Evangelist network.
